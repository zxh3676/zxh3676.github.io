<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>冬日咖啡椅 - Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        #canvas-container { width: 100vw; height: 100vh; }
        #loading {
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); color: white; font-family: sans-serif;
            pointer-events: none;
        }
        #fps-counter {
            position: absolute; top: 10px; left: 10px;
            color: red; font-size: 12px; font-family: sans-serif;
            pointer-events: none; z-index: 100;
        }
    </style>
</head>
<body>
    <div id="fps-counter">FPS: 0</div>
    <div id="loading">加载场景中...</div>
    <div id="canvas-container"></div>

    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { Reflector } from 'three/addons/objects/Reflector.js';

        // --- 1. 初始化场景 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x202025); // 深色背景模拟冬夜/室内
        scene.fog = new THREE.FogExp2(0x202025, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 3, 4);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- 2. 灯光 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffeebb, 1.5);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- 3. 辅助函数：生成纹理 ---
        
        // 生成模糊圆点纹理（用于雪花和热气）
        function createSoftTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.4, 'rgba(255,255,255,0.5)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 32, 32);
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // 生成格纹纹理
        function createCheckerTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#444'; // 深色地砖
            ctx.fillRect(0, 0, 512, 512);
            ctx.fillStyle = '#666'; // 浅色地砖
            ctx.fillRect(0, 0, 256, 256);
            ctx.fillRect(256, 256, 256, 256);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(4, 4);
            // 旋转纹理以形成菱形视觉，或者旋转几何体
            texture.rotation = Math.PI / 4; 
            texture.center.set(0.5, 0.5);
            return texture;
        }

        // --- 4. 地板 (菱形地砖) ---
        const floorGeo = new THREE.PlaneGeometry(20, 20);
        const floorMat = new THREE.MeshStandardMaterial({ 
            map: createCheckerTexture(),
            roughness: 0.8,
            metalness: 0.2
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- 5. 镜子 ---
        const mirrorGeo = new THREE.PlaneGeometry(4, 6);
        const mirror = new Reflector(mirrorGeo, {
            clipBias: 0.003,
            textureWidth: window.innerWidth * window.devicePixelRatio,
            textureHeight: window.innerHeight * window.devicePixelRatio,
            color: 0x889999
        });
        mirror.position.set(0, 3, -3); // 放在椅子后面
        // 给镜子加个边框
        const borderGeo = new THREE.BoxGeometry(4.2, 6.2, 0.1);
        const borderMat = new THREE.MeshStandardMaterial({ color: 0x332211 });
        const border = new THREE.Mesh(borderGeo, borderMat);
        border.position.set(0, 3, -3.06);
        scene.add(border);
        scene.add(mirror);

        // --- 6. 椅子模型 (组合几何体) ---
        const chairGroup = new THREE.Group();
        const woodMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.6 });

        // 椅子腿
        const legGeo = new THREE.BoxGeometry(0.1, 1, 0.1);
        const legPositions = [
            [-0.4, 0.5, 0.4], [0.4, 0.5, 0.4],
            [-0.4, 0.5, -0.4], [0.4, 0.5, -0.4]
        ];
        legPositions.forEach(pos => {
            const leg = new THREE.Mesh(legGeo, woodMaterial);
            leg.position.set(...pos);
            leg.castShadow = true;
            leg.receiveShadow = true;
            chairGroup.add(leg);
        });

        // 椅面
        const seatGeo = new THREE.BoxGeometry(1, 0.1, 1);
        const seat = new THREE.Mesh(seatGeo, woodMaterial);
        seat.position.y = 1.05;
        seat.castShadow = true;
        seat.receiveShadow = true;
        chairGroup.add(seat);

        // 椅背
        const backGeo = new THREE.BoxGeometry(1, 1.2, 0.1);
        const back = new THREE.Mesh(backGeo, woodMaterial);
        back.position.set(0, 1.6, -0.45);
        back.castShadow = true;
        back.receiveShadow = true;
        chairGroup.add(back);

        scene.add(chairGroup);

        // --- 7. 咖啡杯 ---
        const cupGroup = new THREE.Group();
        cupGroup.position.set(0.2, 1.1, 0.2); // 放在椅子上

        // 杯身
        const cupGeo = new THREE.CylinderGeometry(0.15, 0.12, 0.25, 32);
        const cupMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const cup = new THREE.Mesh(cupGeo, cupMat);
        cup.position.y = 0.125;
        cup.castShadow = true;
        cupGroup.add(cup);

        // 咖啡液体
        const liquidGeo = new THREE.CircleGeometry(0.13, 32);
        const liquidMat = new THREE.MeshStandardMaterial({ color: 0x331100 });
        const liquid = new THREE.Mesh(liquidGeo, liquidMat);
        liquid.rotation.x = -Math.PI / 2;
        liquid.position.y = 0.22;
        cupGroup.add(liquid);

        // 把手
        const handleGeo = new THREE.TorusGeometry(0.06, 0.015, 8, 32, Math.PI);
        const handle = new THREE.Mesh(handleGeo, cupMat);
        handle.position.set(0.15, 0.15, 0);
        handle.rotation.z = -Math.PI / 2;
        cupGroup.add(handle);

        scene.add(cupGroup);

        // --- 8. 热气特效 (粒子) ---
        const steamParticleCount = 40;
        const steamGeom = new THREE.BufferGeometry();
        const steamPositions = new Float32Array(steamParticleCount * 3);
        // 为每个粒子添加初始随机偏移，让它们不要同时产生
        const steamOffsets = new Float32Array(steamParticleCount);

        for(let i=0; i<steamParticleCount; i++) {
            steamPositions[i*3] = 0;
            steamPositions[i*3+1] = 0;
            steamPositions[i*3+2] = 0;
            steamOffsets[i] = Math.random() * 100; // 随机时间偏移
        }
        steamGeom.setAttribute('position', new THREE.BufferAttribute(steamPositions, 3));
        
        const steamMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.5,
            transparent: true,
            opacity: 0.3,
            map: createSoftTexture(),
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });
        
        const steamSystem = new THREE.Points(steamGeom, steamMat);
        steamSystem.position.copy(cupGroup.position);
        steamSystem.position.y += 0.25; // 从杯口开始
        scene.add(steamSystem);

        // --- 9. 下雪特效 ---
        const snowCount = 2000;
        const snowGeo = new THREE.BufferGeometry();
        const snowPos = [];
        const snowVelocities = []; // 每个雪花的速度

        for(let i=0; i<snowCount; i++) {
            const x = (Math.random() - 0.5) * 20;
            const y = Math.random() * 15;
            const z = (Math.random() - 0.5) * 20;
            snowPos.push(x, y, z);
            
            // 随机速度，模拟大小不一造成的下落速度差异
            snowVelocities.push(0.02 + Math.random() * 0.05);
        }
        
        snowGeo.setAttribute('position', new THREE.Float32BufferAttribute(snowPos, 3));
        
        // 使用 sizeAttenuation: true 让远处的雪花变小，近处的变大，符合透视
        // 结合模糊贴图，近处的大雪花看起来会比较模糊（Soft Texture）
        const snowMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.2, // 基础大小
            map: createSoftTexture(),
            transparent: true,
            opacity: 0.8,
            alphaTest: 0.01,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            sizeAttenuation: true 
        });

        const snowSystem = new THREE.Points(snowGeo, snowMat);
        scene.add(snowSystem);

        // --- 动画循环 ---
        const clock = new THREE.Clock();

        // FPS 计数器变量
        const fpsCounter = document.getElementById('fps-counter');
        let frameCount = 0;
        let lastFpsTime = performance.now();

        // 隐藏加载文字
        document.getElementById('loading').style.display = 'none';

        function animate() {
            requestAnimationFrame(animate);
            
            // FPS 计算
            frameCount++;
            const currentFpsTime = performance.now();
            if (currentFpsTime - lastFpsTime >= 1000) {
                fpsCounter.textContent = `FPS: ${frameCount}`;
                frameCount = 0;
                lastFpsTime = currentFpsTime;
            }

            const time = clock.getElapsedTime();

            // 1. 热气动画
            const steamPositions = steamSystem.geometry.attributes.position.array;
            for(let i=0; i<steamParticleCount; i++) {
                // 使用取模运算制造循环
                // 每个粒子的“生命周期”y值
                let y = (time * 0.5 + steamOffsets[i] * 0.05) % 2; 
                
                // x 和 z 随上升摆动
                const x = Math.sin(time * 2 + steamOffsets[i]) * 0.05 * y;
                const z = Math.cos(time * 1.5 + steamOffsets[i]) * 0.05 * y;

                // 透明度随高度衰减 (这里实际上没法直接改单个粒子的透明度，
                // 除非用Shader，这里我们通过重置位置模拟)
                
                steamPositions[i*3] = x;
                steamPositions[i*3+1] = y;
                steamPositions[i*3+2] = z;
            }
            steamSystem.geometry.attributes.position.needsUpdate = true;

            // 2. 雪花动画
            const positions = snowSystem.geometry.attributes.position.array;
            for(let i = 0; i < snowCount; i++) {
                // 下落
                positions[i * 3 + 1] -= snowVelocities[i];

                // 飘动 (x轴微动)
                positions[i * 3] += Math.sin(time + positions[i*3+1]) * 0.002;

                // 触底重置
                if (positions[i * 3 + 1] < 0) {
                    positions[i * 3 + 1] = 15;
                    positions[i * 3] = (Math.random() - 0.5) * 20;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 20;
                }
            }
            snowSystem.geometry.attributes.position.needsUpdate = true;
            
            // 旋转雪花系统增加动态感
            snowSystem.rotation.y = time * 0.05;

            controls.update();
            renderer.render(scene, camera);
        }

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            // 镜子分辨率不需要实时调整，或者也可以在这里重建镜子
        });

        animate();
    </script>
</body>
</html>
